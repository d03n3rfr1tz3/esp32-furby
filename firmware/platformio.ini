; ESP32 Furby — firmware build configuration
;
; Toolchain per ARCH-D3 (docs/FSD.md §5.3): PlatformIO with the Arduino-ESP32 3.x core,
; obtained through the `pioarduino` platform fork. The fork is not optional — the official
; platformio/platform-espressif32 still ships the Arduino 2.x core — and it is pinned to an
; explicit release rather than the moving `stable` tag so that a checkout builds the same
; way tomorrow as it does today (F-02).

[platformio]
default_envs = furby

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

; ESP32 classic, WROOM-class module (HW-D1). `esp32dev` is the generic WROOM-32 profile.
board = esp32dev

; Two ~1.9 MB application slots, which OTA (F-70) needs. Assumes 4 MB of flash — the usual
; WROOM-32 configuration, to be confirmed against the module actually installed (docs/hardware.md).
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; `config.h` and `config.example.h` sit at the project root (docs/FSD.md §12), which is not on
; the include path by default.
build_flags =
    -I $PROJECT_DIR
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=3

[env:furby]
